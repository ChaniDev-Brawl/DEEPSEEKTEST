<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="screen-orientation" content="landscape">
<meta name="x5-orientation" content="landscape">
<meta name="full-screen" content="yes">
<title>ISO CITY v2.2 Flash Lite</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    height:100%;width:100%;overflow:hidden;background:#05080e;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#e8eef7;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #game{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair}

  #hud{
    position:fixed;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    display:flex;gap:2px;padding:5px;z-index:10;
    background:rgba(10,16,26,.85);
    border:1px solid rgba(120,170,255,.14);
    border-radius:12px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 6px 20px rgba(0,0,0,.5);
    max-width:calc(100vw - 16px);
  }
  .stat{min-width:56px;padding:1px 7px;text-align:center}
  .stat b{display:block;font-size:13px;font-weight:700}
  .stat span{display:block;font-size:7px;letter-spacing:.08em;text-transform:uppercase;color:#6f8299;margin-top:1px}
  #money{color:#6ee7a0}
  #pop{color:#7cc4ff}
  #inc{color:#ffd166}
  #clock{color:#c8b3ff}
  .flash b{animation:flashRed .32s ease}
  @keyframes flashRed{0%,100%{color:inherit}50%{color:#ff5b5b !important}}

  #toolbar{
    position:fixed;left:calc(6px + env(safe-area-inset-left));top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:2px;padding:5px;z-index:10;
    background:rgba(10,16,26,.85);
    border:1px solid rgba(120,170,255,.14);
    border-radius:14px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    max-height:calc(100vh - 30px);overflow-y:auto;scrollbar-width:none;
    box-shadow:0 6px 20px rgba(0,0,0,.5);
    width:66px;
  }
  #toolbar::-webkit-scrollbar{display:none}
  .tool{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:54px;height:46px;gap:1px;flex:0 0 auto;
    background:transparent;border:1px solid transparent;border-radius:9px;
    color:#93a6bd;font:inherit;cursor:pointer;position:relative;
    transition:background .12s,color .12s,border-color .12s;
    padding:0;
  }
  .tool:hover{background:rgba(255,255,255,.07);color:#dbe7f7}
  .tool:active{transform:scale(.94)}
  .tool.active{
    background:rgba(80,160,255,.20);border-color:rgba(90,170,255,.6);color:#fff;
    box-shadow:inset 0 0 14px rgba(80,160,255,.25);
  }
  .tool.capital.active{
    background:rgba(255,180,80,.24);border-color:rgba(255,200,100,.7);
  }
  .tool.locked{opacity:.42}
  .tool i{font-style:normal;font-size:15px;line-height:1}
  .tool span{font-size:7.5px;letter-spacing:.03em;line-height:1}
  .tool em{font-style:normal;font-size:7.5px;color:#5fbf8a;font-weight:600;line-height:1}
  .tool .key{
    position:absolute;top:1px;right:3px;font-size:7px;color:#4a5a70;
    background:rgba(0,0,0,.5);border-radius:2px;padding:0 2px;font-weight:700;
  }
  .tool-divider{height:1px;background:rgba(120,170,255,.14);margin:2px 3px;flex:0 0 auto}
  .tool-cat{
    font-size:6.5px;letter-spacing:.1em;text-transform:uppercase;
    color:#4a5a70;text-align:center;padding:1px 0;flex:0 0 auto;
  }

  #actions{
    position:fixed;top:calc(6px + env(safe-area-inset-top));right:calc(6px + env(safe-area-inset-right));
    display:flex;gap:4px;z-index:10;
  }
  .abtn{
    width:34px;height:34px;border-radius:9px;
    background:rgba(10,16,26,.85);border:1px solid rgba(120,170,255,.16);
    color:#93a6bd;cursor:pointer;font-size:14px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:center;
    transition:all .15s;
  }
  .abtn:hover{background:rgba(80,160,255,.2);color:#fff}
  .abtn:active{transform:scale(.92)}

  #zoomctl{
    position:fixed;bottom:calc(6px + env(safe-area-inset-bottom));
    right:calc(6px + env(safe-area-inset-right));
    display:flex;flex-direction:column;gap:3px;z-index:10;
  }
  #rotctl{
    position:fixed;bottom:calc(6px + env(safe-area-inset-bottom));
    right:calc(50px + env(safe-area-inset-right));
    display:flex;flex-direction:column;gap:3px;z-index:10;
  }
  .zbtn,.rbtn{
    width:34px;height:34px;border-radius:9px;
    background:rgba(10,16,26,.85);border:1px solid rgba(120,170,255,.16);
    color:#93a6bd;cursor:pointer;font-size:14px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:center;
    transition:all .15s;
  }
  .zbtn:hover,.rbtn:hover{background:rgba(80,160,255,.2);color:#fff}
  .zbtn:active,.rbtn:active{transform:scale(.92)}

  #compass{
    position:fixed;top:calc(6px + env(safe-area-inset-top));left:calc(6px + env(safe-area-inset-left));
    width:38px;height:38px;z-index:10;
    background:rgba(10,16,26,.85);border:1px solid rgba(120,170,255,.16);
    border-radius:50%;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.4);cursor:pointer;
  }
  #compassN{
    position:absolute;top:1px;left:50%;transform:translateX(-50%);
    font-size:7px;font-weight:700;color:#ff8080;letter-spacing:.05em;
  }
  #compassNeedle{
    width:2px;height:13px;
    background:linear-gradient(180deg,#ff5555 0%,#ff5555 50%,#5aa0ff 50%,#5aa0ff 100%);
    border-radius:2px;
  }

  #toasts{
    position:fixed;top:calc(50px + env(safe-area-inset-top));right:calc(6px + env(safe-area-inset-right));
    display:flex;flex-direction:column;gap:4px;z-index:20;pointer-events:none;
    align-items:flex-end;max-width:calc(100vw - 90px);
  }
  .toast{
    background:rgba(20,28,42,.95);border:1px solid rgba(120,170,255,.2);
    padding:6px 11px;border-radius:9px;font-size:10px;color:#dbe7f7;
    box-shadow:0 5px 15px rgba(0,0,0,.5);
    animation:toastIn .3s ease,toastOut .3s ease 2.2s forwards;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    display:flex;align-items:center;gap:5px;
  }
  .toast.warn{border-color:rgba(255,120,120,.4);color:#ffb8b8}
  .toast.good{border-color:rgba(120,255,170,.4);color:#b8ffd4}
  .toast.info{border-color:rgba(120,180,255,.4);color:#b8d4ff}
  .toast i{font-style:normal;font-size:12px}
  @keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
  @keyframes toastOut{to{opacity:0;transform:translateX(20px)}}

  #expandPanel{
    position:fixed;bottom:calc(6px + env(safe-area-inset-bottom));
    left:calc(6px + env(safe-area-inset-left));
    z-index:10;
    background:rgba(10,16,26,.92);border:1px solid rgba(255,200,100,.3);
    padding:7px 10px;border-radius:10px;font-size:9px;color:#dbe7f7;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    display:none;align-items:center;gap:6px;max-width:230px;
  }
  #expandPanel.show{display:flex}
  #expandPanel b{color:#ffd166;display:block;margin-bottom:1px;font-size:10px}
  #expandPanel span{color:#8fa2ba;font-size:8px;line-height:1.3}
  #expandPanel button{
    padding:4px 8px;border-radius:6px;font:inherit;font-size:9px;font-weight:700;
    background:linear-gradient(180deg,#f5b942,#d99a2a);color:#1a1206;
    border:none;cursor:pointer;white-space:nowrap;
  }
  #expandPanel button:disabled{opacity:.4}

  #modal{
    position:fixed;inset:0;background:rgba(0,0,0,.75);
    display:none;align-items:center;justify-content:center;z-index:100;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    padding:16px;
  }
  #modal.show{display:flex}
  .dialog{
    background:rgba(18,26,40,.98);border:1px solid rgba(120,170,255,.24);
    border-radius:14px;padding:18px;min-width:260px;max-width:100%;
  }
  .dialog h2{font-size:14px;margin-bottom:10px;color:#dbe7f7;font-weight:600}
  .dialog input{
    width:100%;padding:9px 11px;font-size:14px;
    background:rgba(0,0,0,.35);border:1px solid rgba(120,170,255,.24);
    border-radius:9px;color:#fff;font:inherit;outline:none;
  }
  .dialog input:focus{border-color:rgba(90,170,255,.7)}
  .dialog .btns{display:flex;gap:6px;margin-top:12px;justify-content:flex-end}
  .dialog button{
    padding:7px 14px;border-radius:8px;font:inherit;font-size:12px;font-weight:600;
    cursor:pointer;border:1px solid transparent;
  }
  .dialog button.primary{
    background:linear-gradient(180deg,#3d8dff,#2563eb);color:#fff;
  }
  .dialog button.sec{
    background:rgba(255,255,255,.06);color:#93a6bd;
    border-color:rgba(255,255,255,.1);
  }

  /* ---------- ROTATE LOCK (portrait) ---------- */
  #rotateLock{
    position:fixed;inset:0;background:#05080e;z-index:9999;
    display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    color:#dbe7f7;text-align:center;padding:20px;
  }
  #rotateLock.show{display:flex}
  #rotateLock .phone{
    width:56px;height:90px;border:3px solid #7cc4ff;border-radius:9px;
    position:relative;animation:rotatePhone 2s ease-in-out infinite;
  }
  #rotateLock .phone::after{
    content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
    width:20px;height:3px;background:#7cc4ff;border-radius:2px;
  }
  @keyframes rotatePhone{
    0%,40%{transform:rotate(0deg)}
    60%,100%{transform:rotate(90deg)}
  }
  #rotateLock h2{font-size:16px;font-weight:600}
  #rotateLock p{font-size:12px;color:#8fa2ba;max-width:280px}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="rotateLock">
  <div class="phone"></div>
  <h2>📱 Gire o dispositivo</h2>
  <p>ISO CITY Flash Lite foi feito para jogar em modo paisagem</p>
</div>

<div id="hud">
  <div class="stat" id="statMoney"><b id="money">$3600</b><span>Dinheiro</span></div>
  <div class="stat"><b id="pop">0</b><span>Pop</span></div>
  <div class="stat"><b id="inc">$0.0</b><span>Renda/s</span></div>
  <div class="stat"><b id="clock">☀️ 06:00</b><span>Dia 1</span></div>
</div>

<div id="compass" title="Bússola">
  <div id="compassN">N</div>
  <div id="compassNeedle"></div>
</div>

<div id="actions">
  <button class="abtn" id="btnSound" title="Som">🔊</button>
  <button class="abtn" id="btnName" title="Renomear">✏️</button>
  <button class="abtn" id="btnSave" title="Salvar">💾</button>
  <button class="abtn" id="btnLoad" title="Carregar">📂</button>
  <button class="abtn" id="btnFull" title="Tela cheia">⛶</button>
</div>

<nav id="toolbar">
  <div class="tool-cat">Básico</div>
  <button class="tool active" data-tool="house"><i>🏠</i><span>Casa</span><em>$145</em><span class="key">1</span></button>
  <button class="tool" data-tool="tree"><i>🌳</i><span>Árvore</span><em>$30</em><span class="key">2</span></button>
  <button class="tool" data-tool="park"><i>🌷</i><span>Parque</span><em>$110</em><span class="key">3</span></button>
  <button class="tool" data-tool="road"><i>🛣️</i><span>Estrada</span><em>$18</em><span class="key">4</span></button>
  <div class="tool-divider"></div>
  <div class="tool-cat">Comércio</div>
  <button class="tool" data-tool="store"><i>🏪</i><span>Loja</span><em>$360</em><span class="key">5</span></button>
  <button class="tool" data-tool="mercearia"><i>🛒</i><span>Mercearia</span><em>$580</em><span class="key">6</span></button>
  <button class="tool" data-tool="mercado"><i>🏬</i><span>Mercado</span><em>$980</em><span class="key">7</span></button>
  <button class="tool" data-tool="shop"><i>🛍️</i><span>Shopping</span><em>$2100</em><span class="key">8</span></button>
  <div class="tool-divider"></div>
  <div class="tool-cat">Serviços</div>
  <button class="tool" data-tool="clinic"><i>🏥</i><span>Hospital</span><em>$2600</em><span class="key">9</span></button>
  <button class="tool" data-tool="school"><i>🏫</i><span>Escola</span><em>$1500</em></button>
  <button class="tool" data-tool="police"><i>🚓</i><span>Delegacia</span><em>$1300</em></button>
  <button class="tool" data-tool="tower"><i>🏢</i><span>Prédio</span><em>$1220</em></button>
  <div class="tool-divider"></div>
  <div class="tool-cat">Capital</div>
  <button class="tool capital" data-tool="capital"><i>🏛️</i><span>Capital</span><em>$8500</em><span class="key">C</span></button>
  <div class="tool-divider"></div>
  <button class="tool" data-tool="grass"><i>🌱</i><span>Grama</span><em>$12</em></button>
  <button class="tool" data-tool="sand"><i>🏖️</i><span>Areia</span><em>$12</em></button>
  <button class="tool" data-tool="water"><i>💧</i><span>Água</span><em>$12</em></button>
  <button class="tool" data-tool="bulldoze"><i>💥</i><span>Demolir</span><em>grátis</em></button>
</nav>

<div id="toasts"></div>

<div id="zoomctl">
  <button class="zbtn" id="zoomIn">＋</button>
  <button class="zbtn" id="zoomOut">−</button>
</div>
<div id="rotctl">
  <button class="rbtn" id="rotL">↺</button>
  <button class="rbtn" id="rotR">↻</button>
</div>

<div id="expandPanel">
  <div style="flex:1">
    <b>🗺️ Território</b>
    <span id="expandInfo">Auto-expansão em 10 tiles livres</span>
  </div>
  <button id="btnExpand">$<span id="expandCost">2500</span></button>
</div>

<div id="modal">
  <div class="dialog">
    <h2 id="modalTitle">Nome da cidade</h2>
    <input type="text" id="modalInput" maxlength="24" placeholder="Ex: Nova Aurora">
    <div class="btns">
      <button class="sec" id="modalCancel">Cancelar</button>
      <button class="primary" id="modalOk">OK</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     1. CANVAS & CONSTANTES
     ========================================================= */
  const canvas = document.getElementById('game');
  const ctx    = canvas.getContext('2d', { alpha: false });

  let W = 0, H = 0, DPR = 1;

  const TILE_W = 64;
  const TILE_H = 32;
  const BASE_Z = -36;
  const DAY_LENGTH = 90;

  let MAP_W = 22;
  let MAP_H = 22;
  const MAP_MAX = 46;
  const EXPANSION_STEP = 4;
  const EXPANSION_BASE_COST = 2500;
  // Auto-expansão: expande quando há poucos tiles livres nas bordas
  const AUTO_EXPAND_FREE_TILES = 40;

  const TERRAIN = {
    grass: { h: 96,  s: 42, l: 48, z: 3  },
    sand:  { h: 44,  s: 58, l: 70, z: 0  },
    water: { h: 202, s: 62, l: 48, z: -5 },
    road:  { h: 220, s: 9,  l: 28, z: 3  }
  };
  const DIRT = { h: 28, s: 30, l: 34 };

  const STRUCTS = {
    house:     { name:'Casa',      cost:145,  pop:4,   income:1.4,  icon:'🏠' },
    tree:      { name:'Árvore',    cost:30,   pop:0,   income:0,    icon:'🌳' },
    park:      { name:'Parque',    cost:110,  pop:0,   income:0.4,  icon:'🌷' },
    store:     { name:'Loja',      cost:360,  pop:3,   income:7.0,  icon:'🏪' },
    mercearia: { name:'Mercearia', cost:580,  pop:5,   income:11.0, icon:'🛒' },
    mercado:   { name:'Mercado',   cost:980,  pop:9,   income:19.0, icon:'🏬' },
    shop:      { name:'Shopping',  cost:2100, pop:22,  income:42.0, icon:'🛍️' },
    clinic:    { name:'Hospital',  cost:2600, pop:14,  income:9.0,  icon:'🏥' },
    school:    { name:'Escola',    cost:1500, pop:8,   income:5.0,  icon:'🏫' },
    police:    { name:'Delegacia', cost:1300, pop:5,   income:4.0,  icon:'🚓' },
    tower:     { name:'Prédio',    cost:1220, pop:26,  income:12.0, icon:'🏢' },
    capital:   { name:'Capital',   cost:8500, pop:80,  income:85.0, icon:'🏛️' }
  };

  const TERRAIN_TOOLS = { grass:12, sand:12, water:12, road:18 };

  /* =========================================================
     2. UTILS
     ========================================================= */
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp  = (a, b, t) => a + (b - a) * t;
  function hsl(h, s, l, a) {
    l = clamp(l, 0, 100);
    return a === undefined ? `hsl(${h},${s}%,${l}%)` : `hsla(${h},${s}%,${l}%,${a})`;
  }
  function hash(x, y) {
    const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return n - Math.floor(n);
  }

  /* =========================================================
     3. CÂMERA — SimCity style com math correta
     ========================================================= */
  const cam = {
    tx: 0, ty: 0,          // target no mundo (x,y)
    zoom: 1, tzoom: 1,
    yaw: 0,                // rad
    cx: 0, cy: 0, cz: 1    // valores suavizados
  };

  function project(x, y, z, yaw) {
    const mx = x - MAP_W / 2;
    const my = y - MAP_H / 2;
    const c = Math.cos(yaw), s = Math.sin(yaw);
    const rx = mx * c - my * s;
    const ry = mx * s + my * c;
    return {
      x: (rx - ry) * (TILE_W * 0.5),
      y: (rx + ry) * (TILE_H * 0.5) - z
    };
  }

  function unproject(sx, sy, yaw) {
    const ix = sx / (TILE_W * 0.5);
    const iy = sy / (TILE_H * 0.5);
    const rx = (ix + iy) * 0.5;
    const ry = (iy - ix) * 0.5;
    const c = Math.cos(-yaw), s = Math.sin(-yaw);
    const mx = rx * c - ry * s;
    const my = rx * s + ry * c;
    return { x: mx + MAP_W / 2, y: my + MAP_H / 2 };
  }

  function worldToScreen(wx, wy, wz) {
    const p = project(wx, wy, wz, cam.yaw);
    return {
      x: p.x * cam.cz + cam.cx + W / 2,
      y: p.y * cam.cz + cam.cy + H / 2
    };
  }

  function screenToTile(sx, sy) {
    const dx = (sx - W / 2 - cam.cx) / cam.cz;
    const dy = (sy - H / 2 - cam.cy) / cam.cz;
    const w = unproject(dx, dy, cam.yaw);
    return { x: Math.floor(w.x), y: Math.floor(w.y) };
  }

  function fillPoly(pts, color) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  /* =========================================================
     4. ILUMINAÇÃO DIRECIONAL (facing camera)
     ---------------------------------------------------------
     Face lateral: normal aponta em X+ (dx>0), Y+ (dy>0),
     ou negativo. O quanto a face "olha pra câmera" depende do
     yaw atual. Shading é calculado por face individualmente.
     ========================================================= */
  function faceBrightness(worldDir, yaw) {
    // worldDir: vetor normal no mundo (unidade)
    // camera "olha" na direção (-cos(yaw), -sin(yaw))... 
    // simplificamos com uma luz fixa rotacionada junto com a câmera
    const lx = Math.cos(yaw + Math.PI / 4);
    const ly = Math.sin(yaw + Math.PI / 4);
    const dot = worldDir.x * lx + worldDir.y * ly;
    return clamp(dot, -1, 1);
  }

  /* =========================================================
     5. RENDER — BLOCO 3D COMPLETO (6 faces com culling)
     ---------------------------------------------------------
     Isso resolve o bug das casas: TODAS as faces visíveis
     são desenhadas com shading correto, independente do yaw.
     ========================================================= */
  function drawBlockFull(x0, y0, x1, y1, z0, z1, h, s, l) {
    // 4 cantos em cada nível
    const pA0 = worldToScreen(x0, y0, z0);
    const pB0 = worldToScreen(x1, y0, z0);
    const pC0 = worldToScreen(x1, y1, z0);
    const pD0 = worldToScreen(x0, y1, z0);
    const pA1 = worldToScreen(x0, y0, z1);
    const pB1 = worldToScreen(x1, y0, z1);
    const pC1 = worldToScreen(x1, y1, z1);
    const pD1 = worldToScreen(x0, y1, z1);

    // Direção de visão da câmera (no mundo, invertido — o que aponta pra fora da tela)
    const viewDir = { x: -Math.cos(cam.yaw), y: -Math.sin(cam.yaw) };
    // viewDir agora aponta do objeto para a câmera
    // (pois câmera está atrás na direção oposta ao viewDir)

    // Face -X (oeste): normal (-1, 0)
    const n_xneg = { x: -1, y: 0 };
    if (n_xneg.x * viewDir.x + n_xneg.y * viewDir.y > 0) {
      const dot = faceBrightness({ x: 0, y: -1 }, cam.yaw); // usa iluminação direcional
      const shade = 0.55 + 0.2 * dot;
      fillPoly([pA1, pA0, pD0, pD1], hsl(h, s, l * shade));
    }
    // Face +X (leste): normal (1, 0)
    const n_xpos = { x: 1, y: 0 };
    if (n_xpos.x * viewDir.x + n_xpos.y * viewDir.y > 0) {
      const dot = faceBrightness({ x: 1, y: 0 }, cam.yaw);
      const shade = 0.85 + 0.2 * dot;
      fillPoly([pB1, pC1, pC0, pB0], hsl(h, s, l * shade));
    }
    // Face -Y (sul): normal (0, -1)
    const n_yneg = { x: 0, y: -1 };
    if (n_yneg.x * viewDir.x + n_yneg.y * viewDir.y > 0) {
      const dot = faceBrightness({ x: 0, y: -1 }, cam.yaw);
      const shade = 0.70 + 0.2 * dot;
      fillPoly([pA1, pB1, pB0, pA0], hsl(h, s, l * shade));
    }
    // Face +Y (norte): normal (0, 1)
    const n_ypos = { x: 0, y: 1 };
    if (n_ypos.x * viewDir.x + n_ypos.y * viewDir.y > 0) {
      const dot = faceBrightness({ x: 0, y: 1 }, cam.yaw);
      const shade = 0.90 + 0.2 * dot;
      fillPoly([pD1, pC1, pC0, pD0], hsl(h, s, l * shade));
    }
    // Topo (sempre visível — assume que a câmera está acima)
    const topDot = faceBrightness({ x: 0.7, y: 0.7 }, cam.yaw);
    const topShade = 1.05 + 0.08 * topDot;
    fillPoly([pA1, pB1, pC1, pD1], hsl(h, s, l * topShade));
  }

  /* =========================================================
     6. PIRÂMIDE COMPLETA (4 faces com culling)
     ---------------------------------------------------------
     Isso resolve o bug dos telhados: TODAS as 4 faces são
     desenhadas ou ocultadas corretamente conforme o yaw.
     ========================================================= */
  function drawPyramidFull(cx, cy, zBase, halfX, halfY, zApex, h, s, l, overhang) {
    const ov = overhang || 0;
    const x0 = cx - halfX - ov, x1 = cx + halfX + ov;
    const y0 = cy - halfY - ov, y1 = cy + halfY + ov;

    const apex = worldToScreen(cx, cy, zApex);
    const p0 = worldToScreen(x0, y0, zBase); // oeste-sul
    const p1 = worldToScreen(x1, y0, zBase); // leste-sul
    const p2 = worldToScreen(x1, y1, zBase); // leste-norte
    const p3 = worldToScreen(x0, y1, zBase); // oeste-norte

    // 4 faces: S (p0-p1-apex), E (p1-p2-apex), N (p2-p3-apex), W (p3-p0-apex)
    // Normais aproximadas (no plano XY)
    const faces = [
      { pts: [p0, p1, apex], n: { x: 0, y: -1 }, sh: 0.72 }, // south
      { pts: [p1, p2, apex], n: { x: 1, y: 0 },  sh: 0.90 }, // east
      { pts: [p2, p3, apex], n: { x: 0, y: 1 },  sh: 0.85 }, // north
      { pts: [p3, p0, apex], n: { x: -1, y: 0 }, sh: 0.60 }  // west
    ];

    // viewDir aponta do objeto para a câmera
    const viewDir = { x: -Math.cos(cam.yaw), y: -Math.sin(cam.yaw) };

    for (const f of faces) {
      const dot = f.n.x * viewDir.x + f.n.y * viewDir.y;
      if (dot > 0.001) {
        // iluminação direcional interna
        const bright = 0.7 + 0.3 * faceBrightness(f.n, cam.yaw);
        fillPoly(f.pts, hsl(h, s, l * f.sh * bright * 1.4));
      }
    }
  }

  /* =========================================================
     7. SHAPE WALL (face plana em uma das 4 direções)
     ---------------------------------------------------------
     Desenha um "papel de parede" fixado a uma face do bloco,
     com culling — some quando a face não está visível.
     dirX, dirY: normal da face (ex: {1,0} = leste)
     ========================================================= */
  function drawWallDecal(x0, y0, x1, y1, z0, z1, dirX, dirY, color) {
    // culling
    const viewDir = { x: -Math.cos(cam.yaw), y: -Math.sin(cam.yaw) };
    const dot = dirX * viewDir.x + dirY * viewDir.y;
    if (dot <= 0.001) return;

    const pts = [
      worldToScreen(x0, y0, z1),
      worldToScreen(x1, y0, z1),
      worldToScreen(x1, y1, z1),
      worldToScreen(x0, y1, z1)
    ];
    // A "face" tem os 4 cantos da base (z0 é apenas a altura base, z1 o topo da parede)
    // Para a face +X (leste): x0=x1, e os cantos são (x0,y0), (x0,y1) com heights variando
    // Vou receber 4 pontos prontos para simplificar — a assinatura é diferente.
  }

  // Versão 2: passa os 4 cantos em world coords direto (mais flexível)
  function drawWallQuad(pts3d, dirX, dirY, color) {
    const viewDir = { x: -Math.cos(cam.yaw), y: -Math.sin(cam.yaw) };
    if (dirX * viewDir.x + dirY * viewDir.y <= 0.001) return;
    const spts = pts3d.map(p => worldToScreen(p[0], p[1], p[2]));
    fillPoly(spts, color);
  }

     ========================================================= */
  let audioCtx = null;
  let soundOn = true;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playTone(freq, dur, type, vol, slideTo) {
    if (!soundOn) return;
    const ac = ensureAudio();
    if (!ac) return;
    try {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + dur);
      g.gain.value = 0;
      g.gain.linearRampToValueAtTime(vol || 0.08, ac.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination);
      o.start();
      o.stop(ac.currentTime + dur + 0.02);
    } catch (e) {}
  }
  const SFX = {
    place:    () => playTone(440, 0.08, 'triangle', 0.06, 660),

  /* =========================================================

     ========================================================= */
  function genMap() {
    tiles = [];
    for (let x = 0; x < MAP_W; x++) {
      tiles[x] = [];
      for (let y = 0; y < MAP_H; y++) {
        tiles[x][y] = { type: 'grass', building: null, anim: 0 };
      }
    }
    // Área inicial plana
    const cx = MAP_W / 2, cy = MAP_H / 2;
    for (let x = 0; x < MAP_W; x++) {
      for (let y = 0; y < MAP_H; y++) {
        if (Math.hypot(x - cx, y - cy) < 5) tiles[x][y].type = 'grass';
        else {
          const n = Math.sin(x * 0.31 + 1.7) * Math.cos(y * 0.27) +
                    Math.sin((x + y) * 0.19) * 0.75 + (hash(x, y) - 0.5) * 0.5;
          if (n < -0.72) tiles[x][y].type = 'water';
          else if (n < -0.50) tiles[x][y].type = 'sand';
        }
      }
    }
    genClouds();
    cars = []; npcs = [];
    countFreeTiles();
  }

  function countFreeTiles() {
    let c = 0;
    // Conta apenas as bordas (1 tile de margem)
    for (let x = 0; x < MAP_W; x++) {
      for (let y = 0; y < MAP_H; y++) {
        const isBorder = x === 0 || y === 0 || x === MAP_W - 1 || y === MAP_H - 1;
        if (isBorder && !tiles[x][y].building && tiles[x][y].type === 'grass') c++;
      }
    }
    freeTiles = c;
  }

  function genClouds() {
    clouds = [];
    for (let i = 0; i < 12; i++) {
      clouds.push({
        x: Math.random() * MAP_W * 2 - MAP_W * 0.5,
        y: Math.random() * MAP_H * 2 - MAP_H * 0.5,
        z: 90 + Math.random() * 40,
        s: 0.6 + Math.random() * 0.9,
        speed: 0.15 + Math.random() * 0.2,
        puffs: 3 + Math.floor(Math.random() * 3)
      });
    }
  }

  /* =========================================================
     12. CÂMERA CONTROLS
     ========================================================= */
  function centerCamera() {
    cam.tx = MAP_W / 2;
    cam.ty = MAP_H / 2;
  }
  function fitCamera() {
    const span = MAP_W + MAP_H;
    const mapW = span * TILE_W * 0.5;
    const mapH = span * TILE_H * 0.5;
    const z = Math.min(W / (mapW + 160), H / (mapH + 180));
    cam.tzoom = clamp(z, 0.28, 1.6);
    centerCamera();
  }

  function drawHouse(x, y, b, z) {
    const m  = 0.16;

    drawBlockFull(x0, y0, x1, y1, z, z + h, 38, 32, 78);

    // Telhado: PIRÂMIDE COMPLETA (4 faces)
    drawPyramidFull((x0 + x1) / 2, (y0 + y1) / 2, z + h,
                    (x1 - x0) / 2, (y1 - y0) / 2,
                    z + h + 9 + b.level * 2,
                    8, 62, 52, 0.07);

    // Janelas em todas as 4 faces
    const wz = z + h * 0.45;
    const wW = 0.20, wH = 5;
    // Face +X (leste)
    drawWallQuad([
      [x1, y0 + 0.35, wz], [x1, y0 + 0.35 + wW, wz],
      [x1, y0 + 0.35 + wW, wz + wH], [x1, y0 + 0.35, wz + wH]
    ], 1, 0, hsl(200, 60, 62));
    // Face -X (oeste)
    drawWallQuad([
      [x0, y1 - 0.35, wz], [x0, y1 - 0.35 - wW, wz],
      [x0, y1 - 0.35 - wW, wz + wH], [x0, y1 - 0.35, wz + wH]
    ], -1, 0, hsl(200, 55, 48));
    // Face +Y (norte)
    drawWallQuad([
      [x1 - 0.55, y1, wz], [x1 - 0.55 + wW, y1, wz],
      [x1 - 0.55 + wW, y1, wz + wH], [x1 - 0.55, y1, wz + wH]
    ], 0, 1, hsl(200, 60, 55));
    // Face -Y (sul)
    drawWallQuad([
      [x0 + 0.35, y0, wz], [x0 + 0.35 + wW, y0, wz],
      [x0 + 0.35 + wW, y0, wz + wH], [x0 + 0.35, y0, wz + wH]
    ], 0, -1, hsl(200, 60, 50));

    // Porta na face +X (fica visível em ângulos frontais)

      [x1, y0 + 0.40, z], [x1, y0 + 0.55, z],

                  [x1 + (x0 - x1) * 0.60, y1, z + h - 6], [x1 + (x0 - x1) * 0.40, y1, z + h - 6]],
      0, 1, hsl(0, 75, 50));
    drawWallQuad([[x1 + (x0 - x1) * 0.25, y1, zmid - 3], [x1 + (x0 - x1) * 0.75, y1, zmid - 3],
                  [x1 + (x0 - x1) * 0.75, y1, zmid + 3], [x1 + (x0 - x1) * 0.25, y1, zmid + 3]],
      0, 1, hsl(0, 75, 50));
    // -Y
    drawWallQuad([[x1 + (x0 - x1) * 0.40, y0, z + 6], [x1 + (x0 - x1) * 0.60, y0, z + 6],
                  [x1 + (x0 - x1) * 0.60, y0, z + h - 6], [x1 + (x0 - x1) * 0.40, y0, z + h - 6]],
      0, -1, hsl(0, 75, 40));

    const o = 0.05;
    drawBlockFull(x0 - o, y0 - o, x1 + o, y1 + o, z + h, z + h + 2.5, 0, 0, 65);

    if (isNight()) {

      grd.addColorStop(1, 'rgba(255,80,80,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(top.x, top.y, 18 * cam.cz, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawSchool(x, y, b, z) {
    const m  = 0.10;
    const x0 = x + m, y0 = y + m, x1 = x + 1 - m, y1 = y + 1 - m;
    const h  = 15 + (b.level - 1) * 6 + b.anim * 2;

                    (x1 - x0) / 2, (y1 - y0) / 2,

                    22, 55, 42, 0.06);

    // Janelas nas 4 faces
    const wR = isNight() ? hsl(48, 90, 82) : hsl(200, 55, 68);

        ], 1, 0, wR);
        drawWallQuad([
          [x0, y0 + (y1 - y0) * u, yy], [x0, y0 + (y1 - y0) * (u + 0.15), yy],
          [x0, y0 + (y1 - y0) * (u + 0.15), yy + 3], [x0, y0 + (y1 - y0) * u, yy + 3]
        ], -1, 0, wL);
        drawWallQuad([
